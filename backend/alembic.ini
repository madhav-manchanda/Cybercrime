# Alembic configuration for the cybercrime-intelligence platform.
[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url =

# The DSN is resolved from application settings at runtime (see migrations/env.py),
# so the placeholder above is intentionally empty.  Override with -x, or set the
# SYNC_DATABASE_URL env var, e.g.:
#   DATABASE_URL="postgresql://user:pass@host:5432/cybercrime" alembic upgrade head

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S