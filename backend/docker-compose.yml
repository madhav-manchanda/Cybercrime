# SIH26184 - Cybercrime Intelligence Platform - local stack
#
#   docker compose up -d postgres redis
#   make seed
#   make api
#
# The API+worker+beat containers read the same .env as local runs.

name: cybercrime-intel

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cybercrime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cybercrime-password}
      POSTGRES_DB: ${POSTGRES_DB:-cybercrime}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cybercrime}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cybercrime}:${POSTGRES_PASSWORD:-cybercrime-password}@postgres:5432/${POSTGRES_DB:-cybercrime}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cybercrime}:${POSTGRES_PASSWORD:-cybercrime-password}@postgres:5432/${POSTGRES_DB:-cybercrime}
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cybercrime}:${POSTGRES_PASSWORD:-cybercrime-password}@postgres:5432/${POSTGRES_DB:-cybercrime}
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: