[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cybercrime-intelligence-backend"
version = "1.0.0"
description = "SIH26184 - Predictive Cybercrime Intelligence Platform (cash-out location / time-window prediction)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SIH 2026 Team" }]

dependencies = [
    # --- Web framework -------------------------------------------------
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "websockets>=12",
    # --- Validation / settings ---------------------------------------
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    # --- Persistence --------------------------------------------------
    "SQLAlchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "geoalchemy2>=0.15",
    "shapely>=2.0",
    "aiosqlite>=0.20",
    # --- Cache / queue -------------------------------------------------
    "redis>=5.0",
    "celery[redis]>=5.4",
    # --- Security -----------------------------------------------------
    "PyJWT>=2.9",
    "argon2-cffi>=23.1",
    "bcrypt>=4.2",
    "passlib[bcrypt]>=1.7.4",
    # --- Observability ------------------------------------------------
    "structlog>=24.4",
    "python-json-logger>=2.0",
    # --- ML ------------------------------------------------------------
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "shap>=0.46",
    "networkx>=3.3",
    "geopandas>=1.0",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]
llm = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".venv", "migrations/versions", "var"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF",
]
ignore = [
    "B008",    # FastAPI Depends() in defaults
    "E501",    # line length handled by formatter
    "RUF001",  # ambiguous unicode in strings (notices are intentional)
    "RUF002",
    "RUF003",
    "SIM108",  # ternary rewrites reduce readability in validation code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
"app/ml/*" = ["NPY002"]
"migrations/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
exclude = "(migrations|tests)/"
# SQLAlchemy 2.1 ships no mypy plugin; declarative models' keyword
# constructors are thus invisible to mypy.  All model construction in this
# codebase uses keyword args, so the call-arg check would be pure noise.
disable_error_code = ["call-arg"]

[[tool.mypy.overrides]]
module = ["shapely.*", "shap", "sklearn.*", "xgboost.*", "networkx.*", "geoalchemy2.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "*/migrations/*", "app/workers/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
